<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Rock Paper Scissors</title>
</head>

<body>
	<header class="header">
		<h1 id="title">Rock Paper Scissors</h1>
	</header>
	<main class="container">
		<div class="card-game">
			<div class="card-item points-container">
				<div class="points-player">
					<img src="img/user.png" alt="Player Icon">
					<h2>Player</h2>
					<p id="player-score">0</p>
				</div>
				<div class="points-computer">
					<img src="img/computer.png" alt="Computer Icon">
					<h2>Computer</h2>
					<p id="computer-score">0</p>
				</div>
			</div>
			<div class="card-item result-container">
				<h2 id="result-message">Make your move!</h2>
			</div>
			<div class="card-item choices-container">
				<button class="btn-choice" id="rock-btn">
					<img src="img/rock.webp" alt="Rock">
					<p>Rock</p>
				</button>
				<button class="btn-choice" id="paper-btn">
					<img src="img/paper.webp" alt="Paper">
					<p>Paper</p>
				</button>
				<button class="btn-choice" id="scissors-btn">
					<img src="img/scissors.webp" alt="Scissors">
					<p>Scissors</p>
				</button>
			</div>
			<div class="card-item" id="game-controls">
				<button id="play-button">Play</button>
				<button id="reset-button">Reset</button>
			</div>
		</div>
	</main>
	<script src="index.js"></script>
</body>

</html>
