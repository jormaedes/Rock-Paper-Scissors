<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Rock Paper Scissors</title>
</head>

<body>
	<header class="header">
		<h1 id="title">Rock Paper Scissors</h1>
	</header>
	<main class="container">
		<div class="card-game">
			<div class="card-item points-container">
				<div class="points-player">
					<img src="img/user.png" alt="Player Icon">
					<h2>Player</h2>
					<p id="player-score">0</p>
				</div>
				<div class="points-computer">
					<img src="img/computer.png" alt="Computer Icon">
					<h2>Computer</h2>
					<p id="computer-score">0</p>
				</div>
			</div>
			<div class="card-item"></div>
			<div class="card-item"></div>
			<div class="card-item"></div>
		</div>
	</main>
	<script src="index.js"></script>
</body>

</html>
