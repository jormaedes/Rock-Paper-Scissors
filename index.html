<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Rock Paper Scissors</title>
</head>

<body>
	<header class="header">
		<h1 id="title">Rock Paper Scissors</h1>
	</header>
	<main class="container">
		<div class="card-game">
			<div class="card-item points-container">
				<div class="points-player">
					<img src="img/user.png" alt="Player Icon">
					<h2>Player</h2>
					<p id="player-score">0</p>
				</div>
				<div class="points-computer">
					<img src="img/computer.png" alt="Computer Icon">
					<h2>Computer</h2>
					<p id="computer-score">0</p>
				</div>
			</div>
			<div class="card-item result-container">
				<h2 id="result-message">Make your move!</h2>
			</div>
			<div class="card-item choices-container">
				<button class="btn-choice" id="rock-btn">
					<img id="rock" src="img/rock.webp" alt="Rock">
					<p>Rock</p>
				</button>
				<button class="btn-choice" id="paper-btn">
					<img id="paper" src="img/paper.webp" alt="Paper">
					<p>Paper</p>
				</button>
				<button class="btn-choice" id="scissors-btn">
					<img id="scissors" src="img/scissors.webp" alt="Scissors">
					<p>Scissors</p>
				</button>
			</div>
			<div class="card-item" id="game-controls">
				<button id="play-button">Play</button>
				<button id="reset-button">Reset</button>
			</div>
		</div>

		<dialog>
			<div class="content-dialog">
				<div class="choice-computer choice">
					<img id="computer-choice-img" src="img/rock.webp" alt="Computer Choice">
					<p id="computer-choice-text">Rock</p>
				</div>
				<div class="result">
					<h2 id="dialog-result-message">It's a Tie!</h2>
				</div>
				<div class="choice-player choice">
					<img id="player-choice-img" src="img/rock.webp" alt="Player Choice">
					<p id="player-choice-text">Rock</p>
				</div>
			</div>
			<button id="close-dialog-button">Close</button>
		</dialog>
	</main>
	<footer class="footer">
		<p>Built by <a href="https://github.com/jormaedes" target="_blank">Jormaedes</a> as part of <a
				href="https://www.theodinproject.com/" target="_blank">The Odin Project</a></p>
		<p>&copy; 2026 Rock Paper Scissors Game</p>
	</footer>
	<script src="index.js"></script>
</body>

</html>
